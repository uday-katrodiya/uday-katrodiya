<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-label="Speed and tracking: Lighthouse tuned to match PageSpeed with history, checkout tracking cleaned up">
  <title>Speed and tracking: Lighthouse tuned to match PageSpeed with history, checkout tracking cleaned up</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="490" height="330" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="490" height="330" fill="url(#bg)"/><rect width="490" height="330" fill="url(#glow)"/><rect width="490" height="330" fill="url(#dots)"/>
    
    <rect x="28" y="26" width="50" height="50" rx="14" fill="url(#accent)"/>
    <g transform="translate(53 51)"><path d="M-11 6a11 11 0 1 1 22 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M0 6l6-8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="0" cy="6" r="2.2" fill="#fff"/></g>
    <text x="92" y="44" class="mono" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5FB0FF">PERFORMANCE</text>
    <text x="92" y="70" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">Speed &amp; tracking you can trust</text>
    
    <g transform="translate(110 176)">
      <path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="12" stroke-linecap="round"/>
      <path d="M-70 0 A70 70 0 0 1 49.5 -49.5" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
      <text x="0" y="-12" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">LCP</text>
    </g>
    <rect x="222" y="104" width="240" height="90" rx="12" fill="#070B2E" fill-opacity="0.7" stroke="#fff" stroke-opacity="0.08"/>
    <polyline points="238,124 270,130 302,128 334,146 366,150 398,166 430,170 446,172" fill="none" stroke="#3DDC84" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="446" cy="172" r="4" fill="#3DDC84" class="pulse"/>
    <text x="238" y="186" class="mono" font-size="10.5" fill="#7F90C4">load time, run by run</text>
    <text x="28" y="224" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Lighthouse tuned to match Google PageSpeed, with</text>
    <text x="28" y="245" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">history and charts. Checkout tracking cleaned of</text>
    <text x="28" y="266" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">duplicate Ads tags and double-counted GA4 views.</text>
    <rect x="28" y="290" width="90" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="73" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Lighthouse</text><rect x="125" y="290" width="123" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="186.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Core Web Vitals</text><rect x="255" y="290" width="45" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="277.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">GA4</text><rect x="307" y="290" width="45" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="329.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">GTM</text>
    <rect x="0.5" y="0.5" width="489" height="329" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
