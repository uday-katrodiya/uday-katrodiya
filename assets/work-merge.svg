<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-label="Catalogue merge: 1,000+ in-store variants merged into online listings with prices, costs and stock per location">
  <title>Catalogue merge: 1,000+ in-store variants merged into online listings with prices, costs and stock per location</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="490" height="330" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="490" height="330" fill="url(#bg)"/><rect width="490" height="330" fill="url(#glow)"/><rect width="490" height="330" fill="url(#dots)"/>
    
    <rect x="28" y="26" width="50" height="50" rx="14" fill="url(#accent)"/>
    <g transform="translate(53 51)"><path d="M-11 -10v4a6 6 0 0 0 6 6h10a6 6 0 0 1 6 6v4M11 -10v4a6 6 0 0 1-6 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
    <text x="92" y="44" class="mono" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5FB0FF">CATALOGUE</text>
    <text x="92" y="70" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">In-store to online merge</text>
    
    <rect x="36" y="110" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.3"/><rect x="66" y="110" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.5"/><rect x="96" y="110" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/><rect x="126" y="110" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.3"/><rect x="36" y="138" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.5"/><rect x="66" y="138" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/><rect x="96" y="138" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.3"/><rect x="126" y="138" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.5"/><rect x="36" y="166" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/><rect x="66" y="166" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.3"/><rect x="96" y="166" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.5"/><rect x="126" y="166" width="22" height="20" rx="4" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path d="M 168 148 H 300" stroke="#5FB0FF" stroke-opacity="0.6" stroke-width="2" class="flow"/>
    <path d="M 292 141 l 9 7 -9 7" fill="none" stroke="#5FB0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="316" y="106" width="146" height="84" rx="12" fill="#070B2E" fill-opacity="0.8" stroke="#3DDC84" stroke-opacity="0.45"/>
    <text x="334" y="134" font-size="14" font-weight="700" fill="#FFFFFF">Online listing</text>
    <text x="334" y="156" class="mono" font-size="11" fill="#A9B8E8">prices · stock</text>
    <text x="334" y="176" class="mono" font-size="11" fill="#3DDC84">✓ every pair logged</text>
    <text x="28" y="224" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Merged 1,000+ in-store variants into their online</text>
    <text x="28" y="245" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">listings, matched by barcode and options, with</text>
    <text x="28" y="266" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">prices, costs and stock per location carried over.</text>
    <rect x="28" y="290" width="71" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="63.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Node.js</text><rect x="106" y="290" width="84" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="148" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Admin API</text><rect x="197" y="290" width="84" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="239" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Inventory</text><rect x="288" y="290" width="45" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="310.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">POS</text>
    <rect x="0.5" y="0.5" width="489" height="329" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
