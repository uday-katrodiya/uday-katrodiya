<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Got a Shopify store that needs fixing or building? Send your store URL. Hire me on Upwork.">
  <title>Got a Shopify store that needs fixing or building? Send your store URL. Hire me on Upwork.</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="1000" height="230" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="1000" height="230" fill="url(#bg)"/><rect width="1000" height="230" fill="url(#glow)"/><rect width="1000" height="230" fill="url(#dots)"/>
    
    <path class="flow" d="M -20 200 C 200 160, 360 240, 560 196 S 840 160, 1020 190" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="2"/>
    <text x="500" y="70" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3.5" fill="#5FB0FF">LET'S BUILD SOMETHING</text>
    <text x="500" y="112" text-anchor="middle" font-size="32" font-weight="800" letter-spacing="-0.6" fill="#FFFFFF">Got a Shopify store that needs fixing or building?</text>
    <text x="500" y="144" text-anchor="middle" font-size="16" fill="#C9D6FF">Send your store URL and the one thing you'd most like changed. I usually reply within 8 hours.</text>
    <g>
      <rect x="380" y="166" width="240" height="44" rx="22" fill="#14A800"/>
      <rect x="380" y="166" width="240" height="44" rx="22" fill="url(#sheen)" class="shine"/>
      <text x="500" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Hire me on Upwork  →</text>
    </g>
    <rect x="0.5" y="0.5" width="999" height="229" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
