<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-label="Checkout and Shopify Functions: custom discount, shipping and payment rules, cart and checkout validation, Thank you and Order status extensions">
