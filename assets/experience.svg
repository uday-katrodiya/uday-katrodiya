<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Experience: Senior Shopify Developer, self-employed on Upwork (Top Rated); Senior Shopify Developer at Dotmagic Infotech; BEng Computer Engineering, Gujarat Technological University 2011 to 2014">
  <title>Experience: Senior Shopify Developer, self-employed on Upwork (Top Rated); Senior Shopify Developer at Dotmagic Infotech; BEng Computer Engineering, Gujarat Technological University 2011 to 2014</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="1000" height="190" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="1000" height="190" fill="url(#bg)"/><rect width="1000" height="190" fill="url(#glow)"/><rect width="1000" height="190" fill="url(#dots)"/>
    
    <line x1="60" y1="42" x2="940" y2="42" stroke="#fff" stroke-opacity="0.15" stroke-width="2"/>
    <g>
      <circle cx="60" cy="42" r="8" fill="#3DDC84" class="pulse"/>
      <text x="79" y="47" class="mono" font-size="12" font-weight="700" letter-spacing="1.5" fill="#3DDC84">NOW</text>
      <text x="45" y="96" font-size="17" font-weight="800" fill="#FFFFFF">Senior Shopify Developer</text>
      <text x="45" y="122" font-size="14" font-weight="600" fill="#5FB0FF">Self-employed · Upwork, Top Rated</text>
      <text x="45" y="150" font-size="13.5" fill="#A9B8E8">Shopify Plus checkout, apps and multi-store retail</text>
    </g><g>
      <circle cx="395" cy="42" r="8" fill="#5FB0FF" />
      <text x="414" y="47" class="mono" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5FB0FF">BEFORE</text>
      <text x="380" y="96" font-size="17" font-weight="800" fill="#FFFFFF">Senior Shopify Developer</text>
      <text x="380" y="122" font-size="14" font-weight="600" fill="#5FB0FF">Dotmagic Infotech</text>
      <text x="380" y="150" font-size="13.5" fill="#A9B8E8">Shopify stores and themes for agency clients</text>
    </g><g>
      <circle cx="730" cy="42" r="8" fill="#5FB0FF" />
      <text x="749" y="47" class="mono" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5FB0FF">2011 – 2014</text>
      <text x="715" y="96" font-size="17" font-weight="800" fill="#FFFFFF">BEng Computer Engineering</text>
      <text x="715" y="122" font-size="14" font-weight="600" fill="#5FB0FF">Gujarat Technological University</text>
      
    </g>
    <rect x="0.5" y="0.5" width="999" height="189" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
