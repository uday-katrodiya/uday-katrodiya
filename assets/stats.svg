<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="138" viewBox="0 0 1000 138" role="img" aria-label="9+ years on Shopify, 40 Upwork jobs and Top Rated, 7 Shopify stores run day to day, 11,200+ metafields moved in one migration, 2.1 million expired discount codes cleaned up">
  <title>9+ years on Shopify, 40 Upwork jobs and Top Rated, 7 Shopify stores run day to day, 11,200+ metafields moved in one migration, 2.1 million expired discount codes cleaned up</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="1000" height="138" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    
    <g>
      <rect x="0.5" y="0.5" width="187" height="137" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="0.5" y="0.5" width="187" height="137" rx="16" fill="url(#dots)"/>
      <rect x="22" y="18" width="34" height="4" rx="2" fill="url(#accent)"/>
      <text x="22" y="74" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">9+</text>
      <text x="22" y="100" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">years building</text>
    <text x="22" y="118" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">on Shopify</text>
      <circle class="pulse" cx="164" cy="20" r="3.5" fill="#3DDC84" style="animation-delay:-0s"/>
    </g>
<g>
      <rect x="203.5" y="0.5" width="187" height="137" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="203.5" y="0.5" width="187" height="137" rx="16" fill="url(#dots)"/>
      <rect x="225" y="18" width="34" height="4" rx="2" fill="url(#accent)"/>
      <text x="225" y="74" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">40</text>
      <text x="225" y="100" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">Upwork jobs,</text>
    <text x="225" y="118" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">Top Rated</text>
      <circle class="pulse" cx="367" cy="20" r="3.5" fill="#3DDC84" style="animation-delay:-0.5s"/>
    </g>
<g>
      <rect x="406.5" y="0.5" width="187" height="137" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="406.5" y="0.5" width="187" height="137" rx="16" fill="url(#dots)"/>
      <rect x="428" y="18" width="34" height="4" rx="2" fill="url(#accent)"/>
      <text x="428" y="74" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">7</text>
      <text x="428" y="100" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">Shopify stores run</text>
    <text x="428" y="118" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">day to day</text>
      <circle class="pulse" cx="570" cy="20" r="3.5" fill="#3DDC84" style="animation-delay:-1s"/>
    </g>
<g>
      <rect x="609.5" y="0.5" width="187" height="137" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="609.5" y="0.5" width="187" height="137" rx="16" fill="url(#dots)"/>
      <rect x="631" y="18" width="34" height="4" rx="2" fill="url(#accent)"/>
      <text x="631" y="74" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">11.2K+</text>
      <text x="631" y="100" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">metafields moved in</text>
    <text x="631" y="118" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">one migration</text>
      <circle class="pulse" cx="773" cy="20" r="3.5" fill="#3DDC84" style="animation-delay:-1.5s"/>
    </g>
<g>
      <rect x="812.5" y="0.5" width="187" height="137" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="812.5" y="0.5" width="187" height="137" rx="16" fill="url(#dots)"/>
      <rect x="834" y="18" width="34" height="4" rx="2" fill="url(#accent)"/>
      <text x="834" y="74" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">2.1M</text>
      <text x="834" y="100" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">expired discount codes</text>
    <text x="834" y="118" font-size="13" font-weight="500" fill="#A9B8E8" text-anchor="start">cleaned up safely</text>
      <circle class="pulse" cx="976" cy="20" r="3.5" fill="#3DDC84" style="animation-delay:-2s"/>
    </g>
    <rect x="0.5" y="0.5" width="999" height="137" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
