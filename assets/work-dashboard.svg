<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-label="Multi-store dashboard: checks and syncs product data across seven Shopify stores, previewed first and verified after">
  <title>Multi-store dashboard: checks and syncs product data across seven Shopify stores, previewed first and verified after</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="490" height="330" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="490" height="330" fill="url(#bg)"/><rect width="490" height="330" fill="url(#glow)"/><rect width="490" height="330" fill="url(#dots)"/>
    
    <rect x="28" y="26" width="50" height="50" rx="14" fill="url(#accent)"/>
    <g transform="translate(53 51)"><rect x="-11" y="-10" width="9" height="9" rx="2" fill="#fff"/><rect x="2" y="-10" width="9" height="9" rx="2" fill="#fff" opacity=".7"/><rect x="-11" y="3" width="9" height="9" rx="2" fill="#fff" opacity=".7"/><rect x="2" y="3" width="9" height="9" rx="2" fill="#fff"/></g>
    <text x="92" y="44" class="mono" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5FB0FF">MULTI-STORE</text>
    <text x="92" y="70" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">One dashboard, seven stores</text>
    
    <circle cx="52" cy="118" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 52 127 C 52 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="86" cy="132" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 86 141 C 86 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="120" cy="118" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 120 127 C 120 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="154" cy="132" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 154 141 C 154 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="188" cy="118" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 188 127 C 188 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="222" cy="132" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 222 141 C 222 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="256" cy="118" r="9" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.7"/>
    <path class="flow" d="M 256 127 C 256 170, 330 150, 352 156" fill="none" stroke="#0581F1" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="352" y="106" width="110" height="88" rx="10" fill="#070B2E" fill-opacity="0.8" stroke="#fff" stroke-opacity="0.12"/>
    <rect x="368" y="136" width="14" height="44" rx="3" fill="url(#accent)" opacity="0.55"/><rect x="390" y="118" width="14" height="62" rx="3" fill="url(#accent)" opacity="0.67"/><rect x="412" y="150" width="14" height="30" rx="3" fill="url(#accent)" opacity="0.79"/><rect x="434" y="126" width="14" height="54" rx="3" fill="url(#accent)" opacity="0.91"/>
    <text x="52" y="186" class="mono" font-size="11.5" fill="#7F90C4">7 stores → one dashboard</text>
    <text x="28" y="224" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Checks and syncs product data across seven stores:</text>
    <text x="28" y="245" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">metafields, bundle prices and weights, Google</text>
    <text x="28" y="266" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Shopping and sales channels. Previewed, then verified.</text>
    <rect x="28" y="290" width="71" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="63.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Node.js</text><rect x="106" y="290" width="84" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="148" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Admin API</text><rect x="197" y="290" width="123" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="258.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Bulk Operations</text>
    <rect x="0.5" y="0.5" width="489" height="329" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
