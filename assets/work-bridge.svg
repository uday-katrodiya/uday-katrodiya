<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-label="POS to Shopify stock bridge: store stock online within a minute, online orders deducted from the right store">
  <title>POS to Shopify stock bridge: store stock online within a minute, online orders deducted from the right store</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="490" height="330" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="490" height="330" fill="url(#bg)"/><rect width="490" height="330" fill="url(#glow)"/><rect width="490" height="330" fill="url(#dots)"/>
    
    <rect x="28" y="26" width="50" height="50" rx="14" fill="url(#accent)"/>
    <g transform="translate(53 51)"><path d="M-11 -4h18m-4 -5 5 5-5 5M11 5h-18m4 -5-5 5 5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="92" y="44" class="mono" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5FB0FF">INTEGRATION</text>
    <text x="92" y="70" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">POS ⇄ Shopify stock bridge</text>
    
    <rect x="28" y="112" width="140" height="72" rx="12" fill="#070B2E" fill-opacity="0.8" stroke="#fff" stroke-opacity="0.12"/>
    <text x="98" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Store POS</text>
    <text x="98" y="164" text-anchor="middle" class="mono" font-size="11" fill="#7F90C4">Lightspeed</text>
    <rect x="322" y="112" width="140" height="72" rx="12" fill="#070B2E" fill-opacity="0.8" stroke="#fff" stroke-opacity="0.12"/>
    <text x="392" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Shopify</text>
    <text x="392" y="164" text-anchor="middle" class="mono" font-size="11" fill="#7F90C4">online store</text>
    <line x1="176" y1="134" x2="314" y2="134" stroke="#5FB0FF" stroke-opacity="0.5" stroke-width="2" class="flow"/>
    <line x1="314" y1="162" x2="176" y2="162" stroke="#3DDC84" stroke-opacity="0.5" stroke-width="2" class="flow"/>
    <text x="245" y="126" text-anchor="middle" class="mono" font-size="10.5" fill="#5FB0FF">stock →</text>
    <text x="245" y="180" text-anchor="middle" class="mono" font-size="10.5" fill="#3DDC84">← orders</text>
    <text x="28" y="224" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">A live two-way link between a retail POS and</text>
    <text x="28" y="245" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Shopify: store stock shows online within a minute,</text>
    <text x="28" y="266" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">and online orders come off the right store's stock.</text>
    <rect x="28" y="290" width="45" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="50.5" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">PHP</text><rect x="80" y="290" width="78" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="119" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Webhooks</text><rect x="165" y="290" width="90" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="210" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">Lightspeed</text><rect x="262" y="290" width="58" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#5FB0FF" stroke-opacity="0.35"/>
    <text x="291" y="306.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#DCE7FF">MySQL</text>
    <rect x="0.5" y="0.5" width="489" height="329" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
