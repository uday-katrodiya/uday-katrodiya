<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Uday Katrodiya, Shopify Plus Engineer with 9+ years: checkout, data and integrations behind fast Shopify Plus stores">
  <title>Uday Katrodiya, Shopify Plus Engineer with 9+ years: checkout, data and integrations behind fast Shopify Plus stores</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="1000" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="1000" height="340" fill="url(#bg)"/><rect width="1000" height="340" fill="url(#glow)"/><rect width="1000" height="340" fill="url(#dots)"/>
    
    <path class="flow" d="M -20 300 C 180 250, 320 350, 520 290 S 820 240, 1020 280" fill="none" stroke="#0581F1" stroke-opacity="0.55" stroke-width="2"/>
    <path class="flow2" d="M -20 322 C 200 290, 360 352, 560 314 S 840 286, 1020 306" fill="none" stroke="#5FB0FF" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="58" y="88" font-size="13" font-weight="700" letter-spacing="3.5" fill="#5FB0FF">SHOPIFY PLUS ENGINEER · 9+ YEARS</text>
    <text x="54" y="156" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Uday Katrodiya</text>
    <text x="58" y="198" font-size="19" font-weight="500" fill="#C9D6FF" text-anchor="start">I build the checkout, data and integrations</text>
    <text x="58" y="226" font-size="19" font-weight="500" fill="#C9D6FF" text-anchor="start">behind fast Shopify Plus stores.</text>
    <rect x="58" y="252" width="103" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07" stroke="#5FB0FF" stroke-opacity="0.45"/>
    <text x="109.5" y="269.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DCE7FF">Checkout UI</text><rect x="169" y="252" width="145" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07" stroke="#5FB0FF" stroke-opacity="0.45"/>
    <text x="241.5" y="269.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DCE7FF">Shopify Functions</text><rect x="322" y="252" width="89" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07" stroke="#5FB0FF" stroke-opacity="0.45"/>
    <text x="366.5" y="269.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DCE7FF">Admin API</text><rect x="419" y="252" width="103" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07" stroke="#5FB0FF" stroke-opacity="0.45"/>
    <text x="470.5" y="269.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DCE7FF">Speed &amp; CRO</text>
    
    <g class="float1">
      <rect x="610" y="32" width="330" height="200" rx="16" fill="#070B2E" fill-opacity="0.82" stroke="#fff" stroke-opacity="0.14"/>
      <circle class="pulse" cx="634" cy="58" r="5" fill="#3DDC84"/>
      <text x="648" y="63" font-size="14" font-weight="700" fill="#FFFFFF">Checkout</text>
      <text x="916" y="63" text-anchor="end" font-size="12" class="mono" fill="#7F90C4">shopify plus</text>
      <line x1="630" y1="78" x2="920" y2="78" stroke="#fff" stroke-opacity="0.1"/>
      <g class="mono" font-size="13">
        <text x="630" y="105" fill="#7F90C4">Subtotal</text><text x="920" y="105" text-anchor="end" fill="#E8EEFF">$184.70</text>
        <text x="630" y="131" fill="#7F90C4">Bundle discount</text><text x="920" y="131" text-anchor="end" fill="#5FB0FF">−$18.47</text>
        <text x="630" y="157" fill="#7F90C4">Shipping</text><text x="920" y="157" text-anchor="end" fill="#5FB0FF">Free</text>
        <line x1="630" y1="174" x2="920" y2="174" stroke="#fff" stroke-opacity="0.1"/>
        <text x="630" y="204" font-size="15" font-weight="700" fill="#FFFFFF" class="sans">Total</text>
        <text x="920" y="204" text-anchor="end" font-size="15" font-weight="700" fill="#FFFFFF">$166.23</text>
      </g>
      <rect x="610" y="32" width="330" height="200" rx="16" fill="url(#sheen)" class="shine"/>
    </g>
    <g class="float2">
      <rect x="584" y="248" width="200" height="44" rx="12" fill="#0E1A5C" stroke="#5FB0FF" stroke-opacity="0.5"/>
      <circle cx="608" cy="270" r="9" fill="#0581F1"/><text x="608" y="274" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">ƒ</text>
      <text x="626" y="266" font-size="12.5" font-weight="700" fill="#FFFFFF">Discount Function</text>
      <text x="626" y="282" font-size="11" fill="#3DDC84">✓ applied in 4 ms</text>
    </g>
    <g class="float3">
      <rect x="796" y="262" width="176" height="44" rx="12" fill="#0E1A5C" stroke="#3DDC84" stroke-opacity="0.5"/>
      <circle cx="820" cy="284" r="9" fill="#3DDC84"/><text x="820" y="288" text-anchor="middle" font-size="11" font-weight="800" fill="#06301A">✓</text>
      <text x="838" y="280" font-size="12.5" font-weight="700" fill="#FFFFFF">Stock synced</text>
      <text x="838" y="296" font-size="11" fill="#A9B8E8">POS → Shopify</text>
    </g>
    <rect x="0.5" y="0.5" width="999" height="339" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
