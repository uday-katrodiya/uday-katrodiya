<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="196" viewBox="0 0 1000 196" role="img" aria-label="How I work: 1 preview every bulk change as a dry run, 2 back up before changing prices, stock or catalogue, 3 read back and log every write so it can be rolled back">
  <title>How I work: 1 preview every bulk change as a dry run, 2 back up before changing prices, stock or catalogue, 3 read back and log every write so it can be rolled back</title>
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .flow{stroke-dasharray:6 10;animation:flow 16s linear infinite}
    .flow2{stroke-dasharray:4 12;animation:flow 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-640}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .float1{animation:float 6s ease-in-out infinite}
    .float2{animation:float 7.5s ease-in-out infinite;animation-delay:-2s}
    .float3{animation:float 5.5s ease-in-out infinite;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .shine{animation:shine 6s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
    
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F3A"/><stop offset="58%" stop-color="#131851"/><stop offset="100%" stop-color="#0A3C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.65">
      <stop offset="0%" stop-color="#0581F1" stop-opacity="0.42"/><stop offset="100%" stop-color="#0581F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#0581F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="1000" height="196" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" class="sans">
    <rect width="1000" height="196" fill="url(#bg)"/><rect width="1000" height="196" fill="url(#glow)"/><rect width="1000" height="196" fill="url(#dots)"/>
    
    <path d="M 120 52 H 880" stroke="#5FB0FF" stroke-opacity="0.45" stroke-width="2" class="flow"/>
    <g>
      <circle cx="65" cy="52" r="20" fill="url(#accent)"/>
      <text x="65" y="58" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text>
      <text x="99" y="58" font-size="19" font-weight="800" fill="#FFFFFF">Preview first</text>
      <text x="45" y="104" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Every bulk change runs as a</text>
    <text x="45" y="126" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">dry run before it touches</text>
    <text x="45" y="148" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">a live store.</text>
    </g><g>
      <circle cx="415" cy="52" r="20" fill="url(#accent)"/>
      <text x="415" y="58" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text>
      <text x="449" y="58" font-size="19" font-weight="800" fill="#FFFFFF">Back it up</text>
      <text x="395" y="104" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Full backups before anything</text>
    <text x="395" y="126" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">that changes prices, stock</text>
    <text x="395" y="148" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">or the catalogue.</text>
    </g><g>
      <circle cx="765" cy="52" r="20" fill="url(#accent)"/>
      <text x="765" y="58" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text>
      <text x="799" y="58" font-size="19" font-weight="800" fill="#FFFFFF">Verify &amp; log</text>
      <text x="745" y="104" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">Every write is read back and</text>
    <text x="745" y="126" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">logged with its old value,</text>
    <text x="745" y="148" font-size="14.5" font-weight="400" fill="#C9D6FF" text-anchor="start">so it can be rolled back.</text>
    </g>
    <rect x="0.5" y="0.5" width="999" height="195" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
